# ─── Prometheus 配置 ──────────────────────────────────────────
# Scrape screeps-exporter 获取 Screeps 帝国指标

global:
  scrape_interval: 15s      # 默认 15s scrape 间隔
  evaluation_interval: 15s  # 规则评估间隔
  external_labels:
    monitor: 'screeps-world'

scrape_configs:
  # ── screeps-exporter: Screeps 游戏 Telemetry ──
  - job_name: 'screeps'
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ['screeps-exporter:9115']
        labels:
          app: 'screeps-world'

  # ── Prometheus 自监控 ──
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

# ─── Recording Rules ──────────────────────────────────────────
# 预计算常用查询，减少 Grafana 面板查询负载
rule_files:
  - /etc/prometheus/rules/*.yml
