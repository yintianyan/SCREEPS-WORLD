# ─── Screeps Recording Rules ────────────────────────────────────
# 预计算常用聚合查询，降低 Grafana 面板查询负载。
# 这些规则在 Prometheus 内部周期性执行（evaluation_interval=15s），
# 结果存储为新的 time series，Grafana 面板直接查询预计算结果。

groups:
  - name: screeps_runtime
    interval: 15s
    rules:
      # CPU 使用率 5 分钟均值
      - record: screeps:cpu_used:avg5m
        expr: avg_over_time(screeps_runtime_cpu_used[5m])

      # Bucket 5 分钟均值
      - record: screeps:bucket:avg5m
        expr: avg_over_time(screeps_runtime_cpu_bucket[5m])

      # Bucket 最低值（枯竭预警）
      - record: screeps:bucket:min5m
        expr: min_over_time(screeps_runtime_cpu_bucket[5m])

      # CPU 跳过率（系统级）
      - record: screeps:kernel:skip_rate5m
        expr: rate(screeps_kernel_process_skipped_total[5m])

      # 内核错误率
      - record: screeps:kernel:error_rate5m
        expr: rate(screeps_kernel_process_failed_total[5m])

  - name: screeps_economy
    interval: 15s
    rules:
      # 帝国总能量
      - record: screeps:empire_energy:avg5m
        expr: avg_over_time(screeps_empire_energy[5m])

      # 净能量收支
      - record: screeps:economy_net:avg5m
        expr: avg_over_time(screeps_economy_energy_net[5m])

      # 孵化队列长度
      - record: screeps:spawn_queue:avg5m
        expr: avg_over_time(screeps_spawn_queue_length[5m])

      # 孵化成功率
      - record: screeps:spawn_success_rate5m
        expr: rate(screeps_spawn_spawned_total[5m]) / (rate(screeps_spawn_spawned_total[5m]) + rate(screeps_spawn_failed_total[5m]))

  - name: screeps_empire
    interval: 15s
    rules:
      # 帝国房间数
      - record: screeps:empire_rooms:avg5m
        expr: avg_over_time(screeps_empire_rooms[5m])

      # 帝国 creep 总数
      - record: screeps:empire_creeps:avg5m
        expr: avg_over_time(screeps_empire_creeps[5m])

      # 帝国健康度
      - record: screeps:empire_health:avg5m
        expr: avg_over_time(screeps_empire_health[5m])

  - name: screeps_evaluation
    interval: 15s
    rules:
      # T3: 期望达成率
      - record: screeps:evaluation_fulfill_rate5m
        expr: rate(screeps_evaluation_expectations_fulfilled_total[5m]) / (rate(screeps_evaluation_expectations_fulfilled_total[5m]) + rate(screeps_evaluation_expectations_missed_total[5m]) + rate(screeps_evaluation_expectations_expired_total[5m]))

      # T3: 各域偏差均值
      - record: screeps:evaluation_deviation:avg5m
        expr: avg_over_time(screeps_evaluation_deviation_percent[5m])

  - name: screeps_logistics
    interval: 15s
    rules:
      # 物流配送效率
      - record: screeps:logistics_efficiency:avg5m
        expr: avg_over_time(screeps_logistics_delivery_efficiency_ratio[5m])
