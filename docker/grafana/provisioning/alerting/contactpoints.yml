# ─── Grafana Alert Contact Points ───────────────────────────────
# 告警通知渠道配置。默认使用 webhook + 内部存储。
# 用户可扩展为 Slack/Discord/Email 等。

apiVersion: 1
contactPoints:
  - orgId: 1
    name: "Screeps Alert Hub"
    receivers:
      # Webhook 通知（可对接 Discord/Slack 等）
      - uid: screeps-webhook
        type: webhook
        settings:
          url: http://screeps-exporter:9115/alert
          httpMethod: POST
          title: "{{ .Labels.alertname }}"
          message: "{{ .Annotations.summary }} — {{ .Annotations.description }}"
        disableResolveMessage: false

  - orgId: 1
    name: "Critical Alert Pager"
    receivers:
      # Critical 级别单独通道
      - uid: screeps-critical-pager
        type: webhook
        settings:
          url: http://screeps-exporter:9115/alert/critical
          httpMethod: POST
          title: "[CRITICAL] {{ .Labels.alertname }}"
          message: "{{ .Annotations.description }}"
        disableResolveMessage: false
