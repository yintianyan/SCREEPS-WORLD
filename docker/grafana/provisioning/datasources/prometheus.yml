# ─── Grafana Data Source Provisioning ──────────────────────────
# 自动配置 Prometheus 数据源，无需手动在 UI 中添加。

apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: '15s'
      httpMethod: POST
