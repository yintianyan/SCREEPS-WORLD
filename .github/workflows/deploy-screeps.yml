# ─── Screeps GitHub 自动部署 ─────────────────────────────────────
# 当 push 到 main/dev 分支时，自动编译 TypeScript 并通过 Screeps API
# 直接上传 dist/main.js 进游戏 —— 无需在 Screeps 端手动同步或绑定分支 pull。
#
# 前置：在仓库 Settings → Secrets and variables → Actions 添加：
#   - Secret  SCREEPS_TOKEN   官服 token（screeps.com/a/#!/account/auth）
#   - Variable SCREEPS_BRANCH  可选，目标代码分支（默认 default）
# 缺 SCREEPS_TOKEN 时上传步骤会失败（API 是唯一部署路径，缺凭据即响亮报错，
# 不做静默绿灯）。
name: Deploy to Screeps

on:
  push:
    branches: [main, dev]
  workflow_dispatch: # 也支持手动触发

permissions:
  contents: read # 仅读取源码；API 直传不需要写仓库

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 跟随 .nvmrc（22.23.1）— 单一真相源，防版本漂移。
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        # --ignore-scripts 跳过原生插件编译：deploy 只需 rollup + typescript，
        # 用不到 isolated-vm（那是 E2E 测试用的 screeps-server-mockup 依赖）。
        # 跳过后既省 2-4 分钟编译，又彻底规避 isolated-vm 的 node-gyp 编译失败。
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Upload code to Screeps (API)
        env:
          SCREEPS_TOKEN: ${{ secrets.SCREEPS_TOKEN }}
          SCREEPS_BRANCH: ${{ vars.SCREEPS_BRANCH || 'default' }}
        run: node tools/deploy-screeps.js
